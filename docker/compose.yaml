# WSL2: WSLg already provides X11 and Wayland, so the GUI needs no xhost calls.
#
#   cd docker && docker compose run --rm dev
#
services:
  dev:
    build:
      context: .
      args:
        HOST_UID: "${HOST_UID:-1000}"
        HOST_GID: "${HOST_GID:-1000}"
    image: casabot-dev
    # host networking so DDS discovery reaches nodes outside the container
    # (the Raspberry Pi, or RViz on the host).
    network_mode: host
    ipc: host
    privileged: true
    environment:
      DISPLAY: "${DISPLAY:-:0}"
      WAYLAND_DISPLAY: "${WAYLAND_DISPLAY:-}"
      XDG_RUNTIME_DIR: "${XDG_RUNTIME_DIR:-/mnt/wslg/runtime-dir}"
      PULSE_SERVER: "${PULSE_SERVER:-/mnt/wslg/PulseServer}"
      # Not 0. Host networking puts this container on the machine's DDS graph,
      # so domain 0 collides with any other ROS running here - another
      # container, a second sim, a colleague on the same LAN. Two Gazebos
      # publishing /scan into one slam_toolbox produces a map that looks
      # plausible and is garbage. Set this to match the robot when you talk
      # to the Pi.
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-42}"
      QT_X11_NO_MITSHM: "1"
      # Uncomment if Gazebo or RViz crashes on startup: forces software OpenGL.
      # LIBGL_ALWAYS_SOFTWARE: "1"
    volumes:
      - ../:/ws/src/casabot
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /mnt/wslg:/mnt/wslg
      - casabot-build:/ws/build
      - casabot-install:/ws/install
      - ~/.casabot:/home/dev/.casabot
    devices:
      - /dev/dri:/dev/dri
    working_dir: /ws
    stdin_open: true
    tty: true

volumes:
  casabot-build:
  casabot-install:
