### robot_localization: fuse wheel odometry with the IMU to publish odom -> base_footprint.
### Wheel odometry alone drifts in yaw on carpet; the gyro fixes that, which is the
### whole reason the IMU is on the bill of materials.
ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true                # indoor floor robot, no pitch/roll/z
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    odom0: odom
    # x y z / roll pitch yaw / vx vy vz / vroll vpitch vyaw / ax ay az
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_queue_size: 10

    imu0: imu/data_raw
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true
    imu0_queue_size: 20
